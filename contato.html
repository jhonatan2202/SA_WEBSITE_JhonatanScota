<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato - Summer Beats Festival</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
      <h1>Summer Beats Festival</h1>
      <h2>Músicas e momentos inesquecíveis para viver o seu verão</h2>
      <nav>
        <h3>Menu:</h3>

        <button>
          <a href="index.html">Home</a>
        </button>

        <button>
          <a href="pagina2.html">Programação</a>
        </button>

        <button>
          <a href="pagina3.html">Galeria de Momentos</a>
        </button>
        <button>
          <a href="contato.html">Contato</a>
        </button>
      </nav>
    </header>
    <main>
      <section id="contato" class="contato-container">
        <h1>Fale Conosco</h1>
        <form class="formulario">
          <div class="form-group">
            <label for="nome">Nome:</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Seu nome completo"
              required
            />
          </div>
          <div class="form-group">
            <label for="email">Email:</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu.email@exemplo.com"
              required
            />
          </div>
          <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(27) 99999-9999"
            />
          </div>
          <div class="form-group">
            <label for="assunto">Assunto:</label>
            <input
              type="text"
              id="assunto"
              name="assunto"
              placeholder="Ex: Dúvida sobre o evento"
              required
            />
          </div>
          <div class="form-group">
            <label for="mensagem">Mensagem:</label>
            <textarea
              id="mensagem"
              name="mensagem"
              placeholder="Escreva sua mensagem aqui..."
              required
            ></textarea>
          </div>
          <button type="submit" class="botao-enviar">Enviar Mensagem</button>
        </form>
      </section>
    </main>
    <footer>
      <p>Email: joseprofissional@profissional.com</p>
      <p>Telefone: 27003000390</p>
      <p>Ano: 2026</p>
    </footer>
  </body>
</html>
